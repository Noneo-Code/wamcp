version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G304 # reading user-chosen files is the point of send_file
  exclusions:
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
