version: 2
project_name: wamcp

builds:
  - main: ./cmd/wamcp
    binary: wamcp
    env:
      - CGO_ENABLED=0 # pure-Go SQLite: static, cross-compiled binaries
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]
